<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title data-i18n="daily.page_title"></title>
<!-- Make10 デイリー（1 日 1 問）。仕様は DAILY-SPEC.md。
     エンジン（有理数・構文解析・評価・盤の操作）と CSS は本編 docs/index.html から 1 文字も変えずに複製してある。
     複製したものと除外の一覧は DAILY-SPEC 18-3、照合は verify_daily.py のケース sync。
     外部から読むのはフォントだけ（計測は集計の版で足す。DAILY-SPEC 2 章・17-1） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── 本編から複製した規則（セレクタごとに本編と同じ。手を入れない）── */
:root{--ease:cubic-bezier(.34,1.28,.64,1); --zoneEase:cubic-bezier(.22,.72,.3,1); --dur:.3s; --hotDur:.2s; --bannerH:52px; --bannerGap:14px}
body[data-theme="ai"]{--ink:#0A1220;--panel:#121D31;--edge:#24344F;--paper:#F4F1E8; --teal:#4FC3B0;--slate:#55688A;--coral:#E2705F;--gold:#E3C16F;--line:159,180,214; --dim:#8FA3C4; --ring:color-mix(in srgb,var(--paper) 22%,transparent); --bannerText:#2F4163}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--ink); color:var(--paper); font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans",sans-serif; font-weight:500;display:flex;justify-content:center;overscroll-behavior:none;touch-action:manipulation}
#bg{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0; background-image: repeating-linear-gradient(60deg,rgba(var(--line),.21) 0 1px,transparent 1px 36px), repeating-linear-gradient(-60deg,rgba(var(--line),.21) 0 1px,transparent 1px 36px), repeating-linear-gradient(0deg,rgba(var(--line),.134) 0 1px,transparent 1px 36px)}
@keyframes sweep{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
#bg.flash{animation:sweep .85s ease-out}
#app{position:relative;z-index:1;width:100%;max-width:430px;display:flex;flex-direction:column; height:100dvh;overflow:hidden; padding:12px 12px calc(var(--bannerGap) + var(--bannerH))}
.bottom{position:relative;flex:0 0 auto}
button{font:inherit;cursor:pointer;color:var(--paper);background:var(--panel); border:1px solid var(--edge);border-radius:11px}
button:active{background:var(--edge)}
.hide{display:none!important}
.ic{width:var(--icW);height:var(--icW);flex:0 0 auto; display:block;fill:none;stroke:currentColor; stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:4px}
.iconbtn{width:var(--btnW);height:var(--btnW);padding:0;border-radius:50%;background:none; border:1.5px solid transparent; color:var(--paper);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.iconbtn:active{background:color-mix(in srgb,var(--paper) 12%,transparent)}
.top .info{flex:1;text-align:center;font-size:12px;color:var(--dim);line-height:1.35}
.readout{flex:1 1 0;min-height:104px;display:flex;flex-direction:column; align-items:center;justify-content:center;gap:10px;padding:4px 0}
.eq{font-size:52px;font-weight:700;line-height:1.1; font-variant-numeric:tabular-nums; transition:color .18s;text-align:center;word-break:break-word}
.eq.idle{font-size:21px;font-weight:500;color:var(--dim)}
.eq.hit{color:var(--gold);transform:scale(var(--tenScale));transform-origin:50% 100%}
.eq.miss{opacity:.5}
.eq.ban{opacity:.75}
.eq.part{font-size:34px;opacity:.75;letter-spacing:.01em}
.sub{font-size:12.5px;color:var(--dim);min-height:18px;text-align:center}
.sub.warn{color:var(--coral)}
.sub.ok{color:color-mix(in srgb,var(--paper) 82%,transparent);letter-spacing:.24em;text-indent:.24em}
.field{flex:1 1 0;min-height:96px;display:flex;align-items:center;justify-content:center; background:none;border:1px solid transparent;border-radius:13px;padding:12px 8px; margin-bottom:10px;position:relative;transition:border-color .15s,background .15s}
.field.trash{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,transparent)}
.field .trashmsg{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11.5px; color:var(--coral);opacity:0;transition:opacity .15s;pointer-events:none}
.field.trash .trashmsg{opacity:1}
.exprwrap{width:100%;display:flex;justify-content:center;overflow:hidden}
.expr{display:flex;align-items:center;flex-wrap:nowrap;width:max-content; transform-origin:center center;will-change:transform; transition:transform var(--dur) var(--zoneEase)}
.num{width:var(--numW);height:var(--tokH);flex:0 0 auto;background:none;color:var(--paper); display:flex;align-items:center;justify-content:center;font-size:var(--numF);font-weight:700; font-variant-numeric:tabular-nums;margin:0 var(--numMx)}
@keyframes pop{0%{transform:translateY(0)}45%{transform:translateY(-13px)}100%{transform:translateY(0)}}
.num.pop{animation:pop .42s var(--ease)}
.tok{flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:600; color:color-mix(in srgb,var(--paper) 76%,transparent); cursor:grab;user-select:none;touch-action:none;transition:color .15s,opacity .15s}
.tok.op{width:var(--opW);height:var(--tokH);font-size:var(--opF)}
.tok.fac{width:var(--facW);height:var(--tokH);font-size:var(--facF);margin-left:var(--facMl)}
.tok.lp,.tok.rp{width:var(--parW);height:var(--tokH);font-size:var(--parF);font-weight:500; color:color-mix(in srgb,var(--paper) 58%,transparent)}
.tok.lone{color:var(--coral)}
.tok.dead{color:var(--slate);opacity:.45}
.tok.lift{opacity:.22}
.tok.swap{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--paper) 70%,transparent)}
@keyframes glow{0%,100%{color:color-mix(in srgb,var(--paper) 76%,transparent);text-shadow:none} 50%{color:var(--paper);text-shadow:0 0 14px color-mix(in srgb,var(--paper) 55%,transparent)}}
.tok.shine{animation:glow .5s}
.zone{flex:0 0 auto;height:var(--tokH);width:0;border-radius:5px;opacity:0; border:0 dashed transparent; transition:width var(--dur) var(--zoneEase),opacity var(--hotDur) linear, background-color var(--hotDur) linear,border-color var(--hotDur) linear}
.zone.snap{transition-duration:var(--hotDur)}
.zone.live{opacity:1;width:var(--zoneW,26px);border-width:1.5px; border-color:color-mix(in srgb,var(--paper) 34%,transparent); background:color-mix(in srgb,var(--paper) 8%,transparent)}
.zone.hot{width:var(--zoneHotW,var(--zoneW,26px)); background:color-mix(in srgb,var(--paper) 26%,transparent); border-color:color-mix(in srgb,var(--paper) 78%,transparent);border-style:solid}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--trayGap); background:none; border:1px solid transparent;border-top-color:var(--edge);padding:var(--trayPad)}
.chip{position:relative;height:54px;border-radius:9px;background:none;border:0; display:flex;align-items:center;justify-content:center;font-size:var(--chipF);font-weight:700; color:var(--paper);cursor:grab;user-select:none;touch-action:none}
.chip:active{background:none;opacity:.5}
.chip.sel{color:var(--paper); box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--paper) 70%,transparent)}
.chip.off{color:var(--slate);opacity:.5;cursor:not-allowed;background:none}
.chip .stock{position:absolute;top:8px;right:calc(50% - 22px);font-size:12px; font-weight:700;color:var(--dim);line-height:1}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.chip.shake{animation:shake .42s}
.foot{display:flex;justify-content:space-between;align-items:center;margin:0 6px 12px}
#ghost{position:fixed;pointer-events:none;z-index:99;font-size:34px;font-weight:700;color:var(--paper); transform:translate(-50%,-50%) scale(1.22);text-shadow:0 3px 10px rgba(0,0,0,.5)}
@media (max-height:700px){
  .readout{min-height:62px;gap:4px;padding:0}
  .eq{font-size:36px}
  .eq.idle{font-size:17px}
  .eq.part{font-size:25px}
  .chip{height:42px}
  .foot{margin:0 6px 8px}
  .top{margin-bottom:0}
  .field{padding:6px;margin-bottom:6px;min-height:72px}
  .stat{height:66px}
  .stat .sv b,.stat .sv .none{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.plainbtn{width:var(--btnW);height:var(--btnW);padding:0;border:0;background:none;color:var(--paper); display:flex;align-items:center;justify-content:center;flex:0 0 auto;opacity:.9}
.plainbtn:active{background:none;opacity:.6}
.chev{width:16px;height:16px;flex:0 0 auto;display:block;fill:none;stroke:currentColor; stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--dim)}
.overlays{position:absolute;bottom:100%;left:0;right:0;margin-bottom:8px; display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
.overlays>*{pointer-events:auto}
.hintbox{font-size:var(--hintF);color:var(--paper);line-height:1.6;background:var(--ink); border:var(--hintBorder) solid transparent;border-top-color:var(--edge);border-bottom-color:var(--edge); padding:4px var(--hintPadX);display:none}
.hintbox.show{display:block}
.hintbox code{font-family:inherit;font-weight:700;line-height:1}
.hintbox .hbin code{margin-left:var(--hintLabelGap,0px)}
.hintrow{display:flex;align-items:center;gap:var(--hintGap)}
.hintrow .hbody{flex:1 1 auto;min-width:0;display:flex;justify-content:safe center; overflow-x:auto;scrollbar-width:none}
.hintrow .hbody>.hbin{flex:0 0 auto;white-space:nowrap}
.hintrow .hbody::-webkit-scrollbar{display:none}
.hintrow .hbody.two{position:relative;align-self:stretch;align-items:center}
.hintrow .hsub{position:absolute;left:0;right:0;bottom:1px;text-align:center; font-size:11.5px;line-height:1.1;color:var(--dim);white-space:nowrap;pointer-events:none}
.hintrow .hsub b{display:inline-block;width:calc(var(--subN)*var(--hintDigitW)); text-align:right;font-weight:inherit}
.hintrow .hbody.tap{cursor:pointer}
#statlist{display:grid;grid-template-columns:1fr 1fr;padding:6px 14px 0}
.stat{height:76px;min-width:0}
.stat .sv{display:flex;align-items:baseline;white-space:nowrap}
.stat .sv b,.stat .sv .none{font-size:26px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.stat .sv .none{color:var(--dim)}
.stat .sv .su{font-size:12px;color:var(--dim);margin-left:4px}
.stat .sk{font-size:11.5px;color:var(--dim);white-space:nowrap}
.top{position:relative}
.top .info b{color:var(--paper);font-weight:700}
.btnlabel{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%); white-space:nowrap}
#share{position:absolute;top:calc(100% + var(--shareGap));right:0;z-index:1}
#hint{position:relative}
#hint{border-color:transparent}
.stocknum{position:absolute;top:-1px;right:-3px;width:22px;height:15px; font-size:11px;font-weight:700;line-height:15px;text-align:center; color:var(--paper);font-variant-numeric:tabular-nums;pointer-events:none}
#hint::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none; border:1.5px solid transparent; -webkit-mask:radial-gradient(circle 13.5px at calc(100% - 8px) 6.5px,transparent 99%,#000 100%); mask:radial-gradient(circle 13.5px at calc(100% - 8px) 6.5px,transparent 99%,#000 100%)}
#hint[aria-disabled="true"]{color:var(--slate);opacity:.5;cursor:not-allowed}
#hint[aria-disabled="true"]:active{background:none}
.hintrow .hbtn{flex:0 0 auto;width:var(--hintBtnW);height:var(--hintBtnH);padding:0; display:flex;align-items:center;justify-content:center; background:none;border:0;border-radius:9px;color:var(--paper)}
.hintrow .hbtn .ic{width:var(--hintIcW);height:var(--hintIcW)}
.hintrow .hbtn:active:not(:disabled){background:var(--edge)}
.hintrow .hbtn:disabled{color:var(--slate);opacity:.5;cursor:not-allowed;background:none}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(12px); background:var(--panel);border:1px solid var(--edge);color:var(--paper); padding:11px 18px;border-radius:12px;font-size:13px;font-weight:700;z-index:80; opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap; box-shadow:0 8px 22px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.atfoot{bottom:auto;transform:translate(-50%,-50%) translateY(12px)}
#toast.atfoot.show{transform:translate(-50%,-50%)}

/* ── デイリーだけの規則（本編に同じセレクタは無い）── */
/* パソコン: 列は幅 430・高さ最大 900 で、画面の上下左右の中央（DAILY-SPEC 14-1）。列の外は地の色だけ */
body.daily{align-items:center}
#app.daily{max-height:900px}
/* 制約がある日の 1 行（13-2）。無い日も高さを取り、式の位置を日によって変えない */
#banline{min-height:18px;font-size:12.5px;line-height:18px;color:var(--dim);text-align:center}
/* 「問題がありません」 */
#nopuzzle{flex:1 1 0;display:flex;align-items:center;justify-content:center;
 font-size:21px;font-weight:500;color:var(--dim);text-align:center}
/* 版とテスト表示。画面のいちばん下の中央（本編の広告の枠の場所。デイリーは広告を出さない）*/
#dfoot{position:absolute;left:0;right:0;bottom:0;height:var(--bannerH);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
 font-size:11.5px;line-height:1.3;color:var(--dim);pointer-events:none}
/* 上のバーの中央。問題番号は本編の .top .info b（白・太字）、日付と曜日は少し小さい副次色（Figma「20 デイリー」）*/
#dinfo span{font-size:11px;letter-spacing:.01em}
/* ギブアップの入口。上のバー左の席（?）の真下。解く前だけ出す（13-2・13-3）。位置は本編の共有ボタンと同じ決め方 */
#dgiveup{position:absolute;top:calc(100% + var(--shareGap));left:0;z-index:1}
/* ギブアップの確認。ヒントの箱の場所（本編の .hintbox と同じ箱）に、文と「はい／いいえ」*/
#gubox .gurow{height:var(--hintBtnH);padding-right:4px}
#gubox .gutext{flex:1 1 auto;text-align:center}
#gubox button{flex:0 0 auto;height:var(--hintBtnH);padding:0 14px;font-size:13px;font-weight:700;
 background:none;border:0;border-radius:9px;color:var(--paper)}
#gubox button:active{background:var(--edge)}
/* ── 解いた後・ギブアップの後（13-5・13-6）。画面を切り替えず、式の下に結果を並べる ──
   下の段（丸ボタンとトレイ）は消すが、場所は取ったままにする（visibility）―― 式の位置を動かさないため。
   結果の並びは、式の下端から重ねて置く（top は layoutResult() が入れる）。左右は列の端まで */
#play.dplay{position:relative}
#play.done .bottom{visibility:hidden}
#play.done #expr,#play.locked #expr,#play.locked #tray{pointer-events:none}
#play.done #dgiveup{display:none}
/* ギブアップの後は、「10」の場所に副次色で「ギブアップ」（金は使わない）*/
.eq.gaveup{font-size:20px;font-weight:500;color:var(--dim);letter-spacing:.08em;text-indent:.08em}
#result{position:absolute;left:-12px;right:-12px;top:var(--resTop,0px);
 display:flex;flex-direction:column;align-items:stretch;gap:var(--resGap,24px)}
/* 時間・ヒントの回数・連続日数の 3 列。列は画面の幅の 3 等分。大きい数字と、下に小さい名前 */
.rcols{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.rcol .rv{display:flex;align-items:baseline;justify-content:center;white-space:nowrap;height:36px}
.rcol .rv b{font-size:26px;font-weight:700;line-height:36px;font-variant-numeric:tabular-nums}
.rcol .rv b.none{color:var(--dim)}
.rcol .rv .ru{font-size:12px;color:var(--dim);margin-left:4px}
/* 単位を出さない言語（英語のヒントの回数）では、空の箱の余白で数字が中央からずれないようにする */
.rcol .rv .ru:empty{display:none}
.rcol .rn{font-size:11.5px;line-height:17px;color:var(--dim)}
/* 全解答の箱（本編のヒント 3 の箱と同じ様式。‹ › × と段階表示は持たない）。行の高さは本編のボタンの高さ */
#solbox{margin:0 12px}
#solbox .hintrow{min-height:var(--hintBtnH)}
/* アプリへの導線。副次色の文字と › */
.applink{align-self:center;display:flex;align-items:center;gap:2px;height:48px;padding:0 12px;
 font-size:13px;font-weight:500;color:var(--dim);text-decoration:none}
.applink:active{opacity:.6}
/* それでも収まらない低い画面だけ、列の中を縦に動かせるようにする（13-5）*/
#app.daily.scrolly{overflow-y:auto}
/* 統計と遊び方。列の中に重ねる 1 枚の画面（× か Esc で閉じる）。
   統計の中の 4 項目は本編の統計の 2 列（#statlist・.stat）*/
.dsheet{position:absolute;inset:0;z-index:20;background:var(--ink);
 padding:12px 12px calc(var(--bannerGap) + var(--bannerH));display:flex;flex-direction:column}
.dsheet .shead{display:flex;align-items:center;justify-content:space-between;height:var(--btnW);
 flex:0 0 auto;margin-bottom:8px}
.dsheet h2{font-size:17px;font-weight:700;margin:0;padding-left:15px}
/* 遊び方の文（本編の遊び方の文と同じ大きさ・行間・明るさ）。式は折り返さない（本編 7.7 と同じ）。
   低い画面で収まらなければ、この中だけ縦に動く */
#dhelpbody{flex:1 1 0;min-height:0;overflow-y:auto;padding:0 15px}
#dhelpbody p{margin:0 0 6px;font-size:13px;line-height:1.75;color:var(--paper);opacity:.85}
#dhelpbody code{font-family:inherit;font-weight:700;white-space:nowrap}
/* 遊び方のいちばん下の、プライバシーポリシーへのリンク（副次色の小さい字・下線 1 本。17-6）*/
#dhelpbody .hlink{margin-top:18px;font-size:12px;opacity:1}
#dhelpbody .hlink a{color:var(--dim);text-decoration:underline;text-underline-offset:3px}
/* 解いた後の並びの共有ボタン「結果を共有」（3 列の下）。面も枠も持たない。絵柄 20px と文字（Figma「20 デイリー」）*/
.rshare{align-self:center;width:168px;height:var(--btnW);padding:0;display:flex;align-items:center;justify-content:center;
 gap:8px;font-size:15px;font-weight:700;letter-spacing:.04em;background:none;border:0;border-radius:0;color:var(--paper)}
.rshare:active{background:none;opacity:.6}
.rshare .ic{width:20px;height:20px}
/* 低い画面の詰め（デイリーだけの規則の分）。上の規則より後ろに置く ―― 前に置くと、同じ強さの
   上の規則に負けて効かない（D0.3 は本編から複製した @media の中に書いていて、効いていなかった）*/
@media (max-height:700px){
  #dfoot{height:40px}
  .rcol .rv{height:30px}
  .rcol .rv b{font-size:22px;line-height:30px}
  .applink{height:44px}
}
</style>
</head>
<body data-theme="ai" class="daily">
<div id="bg"></div>
<div id="app" class="daily">
  <div id="play" class="hide dplay" style="flex:1;display:flex;flex-direction:column">
    <div class="top">
      <!-- 左の席は「?」（遊び方）-->
      <button id="dhelp" class="plainbtn" data-i18n-label="daily.btn_help"></button>
      <div class="info" id="dinfo"></div>
      <button id="dstats" class="plainbtn" data-i18n-label="daily.btn_stats">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 19.5v-7"/><path d="M12 19.5v-15"/><path d="M17.5 19.5v-10"/></svg>
      </button>
      <!-- 共有。統計の真下に重ねる（常に出す）。位置は本編の共有ボタンと同じ決め方（id も同じ）-->
      <button id="share" class="plainbtn" data-i18n-label="daily.btn_share"></button>
      <!-- ギブアップの入口（旗。絵柄は仮・実機で決める）。左の席の真下に重ねる。解く前だけ出す -->
      <button id="dgiveup" class="plainbtn" data-i18n-label="daily.btn_giveup">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 20.5v-16"/><path d="M6.5 5h11l-2.6 3.75 2.6 3.75h-11"/></svg>
      </button>
    </div>
    <div id="banline"></div>
    <div class="readout"><div class="eq idle" id="eq"></div><div class="sub" id="sub"></div></div>

function layoutZones(cls,count){
  const dv=G.devVars||DEV_DEFAULT;
  const zoneMin=dv.zoneMin;
  const delta=count>0?dv.delta:0;
  const base=ZONE_BASE[cls]*(dv.shrink/100);          // 標準の隙間幅（上限）
  const avail=$("exprwrap").clientWidth;              // DOM 読み取りはこの 1 回だけ
  const toks=tokensWidth();
  // 縮小せずに済む隙間幅の上限 = (使える幅 − トークン幅 − Δ) ÷ 枠の数。
  // room（実際に採用できる隙間の余地）も同じ式でなければならない。ここを Δ 抜きで
  // 計算すると、圧縮時に toks + used*count が avail ちょうどになり、そこへ Δ を
  // 足す scale の予約が必ず avail を超えて縮小がかかってしまう
  const noShrinkMax=count>0?(avail-toks-delta)/count:0;
  const room=count>0?noShrinkMax:base;
  const used=count>0?Math.max(zoneMin,Math.min(base,room)):base;
  document.documentElement.style.setProperty("--zoneW",used.toFixed(2)+"px");
  document.documentElement.style.setProperty("--zoneHotW",(used+delta).toFixed(2)+"px");
  zoneCalc={base,used,count,capped:used<base-.01,delta,zoneMin,noShrinkMax};
  // 計算式は変えない。画面が見えている（avail>0）ドラッグ計算だけパネル用に退避する
  if(avail>0)devSnap.zone={...zoneCalc,avail,toks,when:Date.now()};

}

  const r=$("field").getBoundingClientRect();
  if(e.clientY<r.top||e.clientY>r.bottom||e.clientX<r.left||e.clientX>r.right)return null;
  let best=null,bd=1e9;
  document.querySelectorAll(sel).forEach(z=>{
    const b=z.getBoundingClientRect();
    const dx=Math.max(b.left-e.clientX,0,e.clientX-b.right);
    const dy=Math.max(b.top-e.clientY,0,e.clientY-b.bottom);
    const d=Math.sqrt(dx*dx+dy*dy);

  const y=+m[1], mo=+m[2], d=+m[3], x=new Date(y,mo-1,d);
  return x.getFullYear()===y&&x.getMonth()===mo-1&&x.getDate()===d?{y,m:mo,d}:null;

                  sh:共有の回数, e:解いた式（解いたときだけ。開き直したときに盤へ戻す）}
     cur = {no:問題番号, ms:見ていた間の時間（ミリ秒）, h:使ったヒントの回数, sh:共有の回数}
     help = 遊び方を自動で出したら 1（初回だけ出すための印。D0.5）
   ?date=（テスト表示）のときは読まないし書かない。保存できない環境では黙ってそのまま遊べる。
   公開までは保存の形の互換を気にしない（古い形の記録は読めなくてよい。移行の処理は作らない。10 章）*/
const DAILY_KEY="make10.daily.v1";
let DATA={v:1,days:{},cur:null,help:0};
function loadDaily(){
  if(TEST_MODE)return;
  try{
    const x=JSON.parse(localStorage.getItem(DAILY_KEY)||"null");
    if(x&&typeof x==="object"&&x.days&&typeof x.days==="object")
      DATA={v:1,days:x.days,cur:x.cur&&typeof x.cur==="object"?x.cur:null,help:x.help?1:0};
  }catch(e){}
}
function saveDaily(){
  if(TEST_MODE)return;
  try{localStorage.setItem(DAILY_KEY,JSON.stringify(DATA))}catch(e){}
}
/* 今日の問題の記録（解いた・ギブアップのどちらか）。まだなら undefined */
const dayRecord=()=>PUZZLE?DATA.days[PUZZLE.no]:undefined;
const playing=()=>!!PUZZLE&&!dayRecord();

/* ═══ 時間（7 章）═══
   画面を見ている間だけ数える。隠れたら止め、見えたら続きから。途中で閉じて開き直したら、
   保存してある時間の続きから数える（保存できない環境では 0 から）*/
let seenMs=0, seenFrom=null;       // 見ていた間の合計と、いま見ている区間の始まり（見ていなければ null）
let helpHold=false;                // 初回に自動で出た遊び方を読んでいる間。閉じるまで時間を数え始めない（13-10）
const seenNow=()=>seenMs+(seenFrom===null?0:performance.now()-seenFrom);
function watch(on){
  if(on){if(seenFrom===null&&!helpHold)seenFrom=performance.now()}
  else if(seenFrom!==null){seenMs+=performance.now()-seenFrom;seenFrom=null}
}
/* 解いている途中の、使ったヒントの回数と共有の回数（その日の分。解いた・ギブアップした時点で記録へ移す）*/
let hintUsed=0, shareCount=0;
function keepTime(){
  if(!playing())return;
  DATA.cur={no:PUZZLE.no,ms:Math.round(seenNow()),h:hintUsed,sh:shareCount};
  saveDaily();
}
document.addEventListener("visibilitychange",()=>{
  if(!playing())return;
  watch(document.visibilityState==="visible");keepTime()});
window.addEventListener("pagehide",()=>keepTime());
setInterval(()=>{if(seenFrom!==null)keepTime()},5000);   // 見ている間も数秒おきに残す（突然閉じられたときのため）
const fmtTime=sec=>Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");

/* ═══ 連続日数と統計 ═══
   連続日数は「解いた日」を問題番号の連続で数える。ギブアップと遊ばなかった日で途切れる。
   今日まだ遊んでいなければ、昨日までの数を出す（今日ギブアップすると 0）*/
function streakNow(){
  const d=DATA.days;let n=DAILY_NO;
  if(d[n]){if(d[n].r!=="s")return 0}else n--;
  let k=0;while(d[n]&&d[n].r==="s"){k++;n--}
  return k;
}
function statsNow(){
  const d=DATA.days, nos=Object.keys(d).map(Number).filter(n=>d[n].r==="s").sort((a,b)=>a-b);
  let max=0,run=0,prev=null,sum=0;
  for(const n of nos){run=prev!==null&&n===prev+1?run+1:1;if(run>max)max=run;prev=n;sum+=d[n].t||0}
  return{solved:nos.length,streak:streakNow(),max,avg:nos.length?Math.round(sum/nos.length):null};
}

/* ═══ 盤と式の行き来 ═══ */
/* 盤の式を、列の解答と同じ書き方の文字列にする（例 "( 3 + 1 )! / 6 + 6"）*/
function exprOf(){
  const out=[];
  for(const x of T()){
    if(x.t==="fac")out[out.length-1]+="!";
    else out.push(x.t==="num"?String(x.v):x.t==="op"?x.v:x.t==="lp"?"(":")");
  }
  return out.join(" ");
}
/* 式の文字列から盤を組む（描画はしない）*/
function placeExpr(expr){
  uid=1;S={toks:cur.id.split("").map(v=>({id:uid++,t:"num",v:+v}))};held=null;
  let p=0;
  for(const w of expr.split(" ")){
    let x=w,f=0;
    while(x.endsWith("!")){f++;x=x.slice(0,-1)}
    if(/^[0-9]$/.test(x))p++;
    else if(x==="("){put("lp",p);p++}
    else if(x===")"){put("rp",p);p++}
    else if(x){put(x,p);p++}
    for(;f>0;f--){put("!",p);p++}
  }
}

/* ═══ 解いた後・ギブアップの後（13-5・13-6）═══ */
/* 正解した後の処理（本編の win() にあたる。名前は変えてある）。記録はここで 1 回だけ確定する */
function dailySolved(){
  if(!solved||!playing())return;
  watch(false);
  DATA.days[PUZZLE.no]={r:"s",t:Math.max(1,Math.round(seenMs/1000)),h:hintUsed,sh:shareCount,e:exprOf()};
  DATA.cur=null;saveDaily();
  document.querySelectorAll(".num").forEach((n,i)=>
    setTimeout(()=>{n.classList.remove("pop");void n.offsetWidth;n.classList.add("pop")},i*70));
  if(G.vib)navigator.vibrate?.(16);
  setTimeout(showResult,260);
}
function giveUp(){
  if(!playing())return;
  watch(false);
  DATA.days[PUZZLE.no]={r:"g",t:null,h:hintUsed,sh:shareCount};
  DATA.cur=null;saveDaily();
  showResult(true);
}
/* 結果の画面にする。redraw = 盤を組み直す（開き直したとき・ギブアップしたとき）。
   解いた直後は盤がそのまま自分の式なので、組み直さない */
function showResult(redraw){
  const rec=dayRecord();if(!rec)return;
  $("gubox").classList.remove("show");
  hintBox(null);
  $("play").classList.add("done");
  if(redraw){
    solved=true;                              // render() に正解の後の処理を予約させない
    placeExpr(rec.r==="s"&&rec.e?rec.e:PUZZLE.sol);
    render();
  }
  const time=$("r-time");
  time.textContent=rec.r==="s"?fmtTime(rec.t):"—";
  time.classList.toggle("none",rec.r!=="s");
  $("r-hints").textContent=rec.h;$("r-hints-u").textContent=t("daily.unit_times",{n:rec.h});
  const st=streakNow();
  $("r-streak").textContent=st;$("r-streak-u").textContent=t("daily.unit_day",{n:st});
  $("result").classList.remove("hide");
  solAt=0;drawSols();
  layoutResult();
}
/* 全解答の箱（本編 7.1 と同じ見せ方: 1 本ずつ・下に k/N・押すと次へ）。
   解いた後は「解答例：」で全部、ギブアップの後は「ほかの解き方：」で 2 本目から（無ければ箱を出さない）*/
let solAt=0;
const SOL_LABEL_EM={example:HINT_TEXT.labelEm,other:{ja:7,en:6.73}};   // ラベルの幅（em）。英語は実測（Other solutions は 84.11px）
/* 箱の式の縮小率。本編の hintExprScale() と同じ決め方だが、使える幅はデイリーの箱で数える
   （デイリーの箱には ‹ › × と段階表示が無い）。式の幅は本編の hintExprW()（文字ごとの幅の表）*/
function dailySolScale(ex,other){
  const boxW=$("solbox").offsetWidth;
  if(!boxW)return 1;
  const avail=boxW-2*(HINT_ROW.border+HINT_ROW.padX)
    -SOL_LABEL_EM[other?"other":"example"][LANG]*HINT_ROW.font-HINT_TEXT.labelGap[LANG]-HINT_TEXT.slack;
  const w=hintExprW(ex);
  return w>avail?Math.max(MIN_SCALE,avail/w):1;
}
function drawSols(){
  const rec=dayRecord(), box=$("solbox");
  const other=rec.r==="g", list=other?PUZZLE.sols.slice(1):PUZZLE.sols, n=list.length;
  if(!n){box.classList.remove("show");box.innerHTML="";return}
  if(solAt>=n)solAt=0;
  box.classList.add("show");                 // 幅を測るので、先に出しておく
  const tap=n>1, ex=pretty(list[solAt]), k=Math.floor(dailySolScale(ex,other)*1000)/10;
  box.innerHTML=`<div class="hintrow"><span class="hbody two${tap?" tap":""}"`+
    (tap?` id="sol-next" role="button" tabindex="0" aria-label="${t("hint.next_solution",{k:solAt+1,n})}"`:"")+`>`+
    `<span class="hbin">${t(other?"daily.sols_other":"hint.label_example")}`+
    `<code${k<100?` style="font-size:${k}%"`:""}>${ex}</code></span>`+
    `<span class="hsub"><b style="--subN:${String(n).length}">${solAt+1}</b>/${n}</span></span></div>`;
  if(tap){
    const next=byKey=>{solAt=(solAt+1)%n;drawSols();if(byKey)$("sol-next").focus()};
    $("sol-next").onclick=()=>next(false);
    $("sol-next").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();next(true)}};
  }
}
/* 結果の並びを、式の下に置く。間隔は normal 24px・compact 16px から始め、版の行に届くなら
   12 → 8px と詰める。それでも収まらない低い画面だけ、列の中を縦に動かせるようにする（13-5）。
   式と 3 列のあいだだけは、間隔より 8px 広い（Figma「20 デイリー」）*/
function layoutResult(){
  const play=$("play"), res=$("result");
  if(!play.classList.contains("done"))return;
  const top=$("exprwrap").getBoundingClientRect().bottom-play.getBoundingClientRect().top;
  // 上限は、版の行に見えている文字の上端（テスト表示が出ていればその上端）。箱の上端ではない ――
  // Figma は、導線の押せる範囲を版の文字のすぐ上まで使っている
  const limit=Math.min(...[$("dtest"),$("dver")].filter(e=>e.offsetHeight>0).map(e=>e.getBoundingClientRect().top));
  const first=matchMedia(COMPACT_MQ).matches?16:24;
  let fits=false;
  for(const g of [24,16,12,8]){
    if(g>first)continue;
    res.style.setProperty("--resGap",g+"px");
    res.style.setProperty("--resTop",(top+g+8)+"px");
    if(res.getBoundingClientRect().bottom<=limit+.5){fits=true;break}
  }
  $("app").classList.toggle("scrolly",!fits);
}

/* ═══ ヒント（8 章・13-4）═══
   共有するたびに 1 回もらえる（1 日 2 回まで）。中身は解答例 1 本から出す。
     1 回目 = 解答例を左から読んで、最初に出てくる演算の種類
     2 回目 = もう 1 種類（出てくる順）と、括弧を使うかどうか。演算が 1 種類だけなら「ほかの演算は使わない」
   本編のヒント（残数・段階）とは別の仕組みで、関数の名前も別にしてある */
/* 解答例に出てくる演算の種類（+ - * / ^ !）を、初めて出てくる順に */
function hintKinds(sol){
  const out=[];
  for(const c of sol)if("+-*/^!".includes(c)&&!out.includes(c))out.push(c);
  return out;
}
/* n 回目のヒントの文（HTML。記号と「使う／使わない」が太字）*/
function hintHtml(p,n){
  const k=hintKinds(p.sol), label=t("daily.hint_label_ops");
  if(n===1)return `${label}<code>${GLYPH[k[0]]}</code>`;
  const paren=t(p.sol.includes("(")?"daily.hint_paren_yes_html":"daily.hint_paren_no_html");
  return (k.length>1?`${label}<code>${GLYPH[k[0]]} ${GLYPH[k[1]]}</code>`:t("daily.hint_no_other"))
    +t("daily.hint_sep")+paren;
}
/* もらった数（共有の回数。2 回まで）から、使った数を引いた残り */
const hintLeft=()=>Math.min(2,shareCount)-hintUsed;
/* 箱に出しているもの。null = 閉じている / "lock" = もらう前の知らせ / 1・2 = その回のヒント */
let hintShown=null;
function hintBox(what){
  hintShown=what;
  const b=$("hintbox");
  if(what===null){b.classList.remove("show");b.innerHTML=""}
  else{
    $("gubox").classList.remove("show");
    const close=`<button class="hbtn" id="hint-close" aria-label="${t("hint.close")}">${ICON_HCLOSE}</button>`;
    b.innerHTML=`<div class="hintrow"><span class="hbody"><span class="hbin">`+
      (what==="lock"?t("daily.hint_locked"):hintHtml(PUZZLE,what))+`</span></span>`+
      (what==="lock"?`<button class="hbtn" id="hint-share" aria-label="${t("daily.hint_share")}">${ICON_SHARE}</button>`:"")+
      close+`</div>`;
    b.classList.add("show");
    $("hint-close").onclick=()=>hintBox(null);
    if(what==="lock")$("hint-share").onclick=()=>doShare(true);
  }
  drawHintBtn();
}
/* 丸ボタンの右肩の残り回数（0 のときは出さない）と、読み上げの文。
   2 回目を出している間は無効の見た目（押しても何も起きない。閉じれば、押すと読み返せる）*/
function drawHintBtn(){
  const left=hintLeft(), spent=hintShown===2;
  $("hintstock").textContent=left>0?left:"";
  $("hintlabel").textContent=spent?t("daily.hint_sr_spent"):t("daily.hint_sr_left",{n:left});
  if(spent)$("hint").setAttribute("aria-disabled","true");else $("hint").removeAttribute("aria-disabled");
}
/* 次のヒントを 1 回使って出す */
function useHint(){
  hintUsed++;keepTime();
  hintBox(hintUsed);
}
/* 丸ボタン（本編の決まりに揃えた）。
   箱が閉じている: 見たヒントがあれば、最後のものをもう一度（使わない）。無ければ、残りがあれば 1 回目、無ければ知らせ
   箱が開いている: 残りがあれば次のヒント。無ければ、まだ 2 回目を見ていないときだけ知らせ（知らせを出しているなら閉じる）*/
function pressHint(){
  if(!playing())return;
  if(hintShown===null){
    if(hintUsed>0)hintBox(hintUsed);
    else if(hintLeft()>0)useHint();
    else hintBox("lock");
    return;
  }
  if(hintLeft()>0)useHint();
  else if(hintShown==="lock")hintBox(null);
  else if(hintUsed<2)hintBox("lock");
}
$("hint").addEventListener("click",pressHint);

/* ═══ 共有（9 章）═══
   共有するのはページの URL だけ（問題番号や結果を URL に入れない）。共有文に答え・演算・ヒントの中身を入れない */
const DAILY_URL="https://make10.app/daily/";
/* その問題番号の、今の状態の共有文（rec = 1 日ぶんの記録。まだなら undefined）*/
function shareTextOf(no,rec,streak){
  if(!rec)return t("daily.share_before",{no});
  if(rec.r==="s")return t("daily.share_after",{no,time:fmtTime(rec.t),hints:rec.h,streak});
  return t("daily.share_giveup",{no});
}
/* 共有する。共有画面が使えれば共有画面、使えなければ（または拒まれたら）クリップボードにコピーして知らせる。
   共有画面を開いた（閉じただけでも）か、コピーできたら、共有 1 回に数える（実際に送ったかは確かめない。8 章）。
   fromLock = もらう前の知らせの箱から共有した。もらえたら、そのままヒントを出す */
async function doShare(fromLock){
  if(!PUZZLE)return;
  const text=shareTextOf(PUZZLE.no,dayRecord(),streakNow());
  let ok=false;
  if(navigator.share){
    try{await navigator.share({text,url:DAILY_URL});ok=true}
    catch(e){ok=!!e&&e.name==="AbortError"}        // 共有画面を閉じただけ。開いたので数える
  }
  if(!ok){
    try{await navigator.clipboard.writeText(text+"\n"+DAILY_URL);ok=true;toast(t("daily.toast_copied"))}
    catch(e){toast(t("daily.toast_copy_failed"))}
  }
  if(!ok)return;
  const rec=dayRecord();
  if(rec){rec.sh=(rec.sh||0)+1;saveDaily();return}   // 解いた後・ギブアップの後。回数だけ数える
  shareCount++;keepTime();
  if(fromLock&&hintLeft()>0)useHint();               // 知らせの箱から共有した。そのままヒントを出す
  else{if(hintShown==="lock")hintBox(null);drawHintBtn()}
}
$("share").onclick=()=>doShare(false);
$("rshare").onclick=()=>doShare(false);

/* ═══ トースト（除外の一覧。本編のものは、本編の下の段の並びから位置を決める）═══
   解く前は、丸ボタン 2 つ（全部消す・ヒント）の間。解いた後・ギブアップの後は、版の行のすぐ上 */
function toast(msg){
  let e=$("toast");
  if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e)}
  e.textContent=msg;
  const foot=playing();
  if(foot){
    const c=$("clear").getBoundingClientRect(), h=$("hint").getBoundingClientRect();
    e.style.left=(c.right+h.left)/2+"px";e.style.top=(c.top+c.bottom)/2+"px";e.style.bottom="";
  }else{
    e.style.left="";e.style.top="";
    e.style.bottom=(innerHeight-$("dfoot").getBoundingClientRect().top+8)+"px";
  }
  e.classList.toggle("atfoot",foot);
  e.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),1600);
}

/* ═══ ギブアップの入口と確認（13-3）═══ */
$("dgiveup").onclick=()=>{if(!playing())return;hintBox(null);$("gubox").classList.toggle("show")};
$("gu-no").onclick=()=>$("gubox").classList.remove("show");
$("gu-yes").onclick=()=>giveUp();

/* ═══ 統計 ═══ */
function drawStats(){
  const x=statsNow(), day="daily.unit_day";
  const rows=[["daily.stats_solved",x.solved,day],["daily.stats_streak",x.streak,day],
    ["daily.stats_max",x.max,day],["daily.stats_avg",x.avg===null?null:fmtTime(x.avg),null]];
  $("statlist").innerHTML=rows.map(([k,v,u])=>
    `<div class="stat"><div class="sv">`+(v===null?`<span class="none">—</span>`
      :`<b>${v}</b>`+(u?`<span class="su">${t(u,{n:v})}</span>`:""))+
    `</div><div class="sk">${t(k)}</div></div>`).join("");
}
$("dstats-close").innerHTML=ICON_HCLOSE;
$("share").innerHTML=ICON_SHARE;
$("rshare-ic").innerHTML=ICON_SHARE;
$("dstats").onclick=()=>{drawStats();$("dstatsheet").classList.remove("hide")};
$("dstats-close").onclick=()=>$("dstatsheet").classList.add("hide");

/* ═══ 遊び方（13-10）═══
   上のバー左の「?」から開く。初回だけは自動で出す ―― 保存データに印（help）が無いとき。
   ?date=（テスト表示）では自動で出さない。保存できない環境では印が残らないので、開くたびに出る。
   絵柄は Figma「20 デイリー」の D01（丸で囲んだ ?）*/
const ICON_HELP=`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.6C9.7 9.18 9.82 8.77 10.03 8.41C10.24 8.04 10.55 7.74 10.91 7.53C11.28 7.33 11.69 7.22 12.11 7.22C12.53 7.22 12.95 7.34 13.31 7.55C13.67 7.76 13.97 8.06 14.18 8.43C14.39 8.79 14.5 9.21 14.5 9.63C14.5 10.05 14.39 10.46 14.18 10.82C13.97 11.19 13.66 11.49 13.3 11.7C12.5 12.2 12 12.7 12 13.6"/><path d="M12 16.6h.01"/></svg>`;
$("dhelp").innerHTML=ICON_HELP;
$("dhelp-close").innerHTML=ICON_HCLOSE;
function helpShow(){$("dhelpsheet").classList.remove("hide")}
function helpHide(){
  $("dhelpsheet").classList.add("hide");
  if(helpHold){helpHold=false;if(playing())watch(document.visibilityState==="visible")}
}
$("dhelp").onclick=()=>helpShow();
$("dhelp-close").onclick=()=>helpHide();
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  $("dstatsheet").classList.add("hide");helpHide()});

window.addEventListener("resize",()=>{applyMetrics();if(cur)fit();
  if(dayRecord()){drawSols();layoutResult()}});

loadDaily();
applyLang();applyMetrics();
// 正解の「10」の倍率。本編は開発者パネルの applyDevVars() が流す。デイリーは既定値をそのまま流す
document.documentElement.style.setProperty("--tenScale",DEV_DEFAULT.tenScale);
$("dtest").classList.toggle("hide",!TEST_MODE);
if(PUZZLE){
  cur=PUZZLE;$("play").classList.remove("hide");
  if(dayRecord())showResult(true);           // 解いた後・ギブアップの後に開き直した。解き直せない
  else{
    // 解いている途中で開き直した。時間だけ続きから数える（盤は空に戻す）
    // 使ったヒントの回数と共有の回数も、その日の分は続きから
    if(DATA.cur&&DATA.cur.no===PUZZLE.no){
      seenMs=DATA.cur.ms>0?DATA.cur.ms:0;
      hintUsed=Math.min(2,DATA.cur.h>0?DATA.cur.h:0);shareCount=DATA.cur.sh>0?DATA.cur.sh:0;
    }
    else DATA.cur=null;
    clearAll();
    drawHintBtn();
    watch(document.visibilityState==="visible");
  }
  // 遊び方を、初回だけ自動で出す。読んでいる間は時間を数えない（閉じたところから数え始める）
  if(!TEST_MODE&&!DATA.help){
    if(playing()){watch(false);helpHold=true}
    DATA.help=1;saveDaily();
    helpShow();
  }
}
else $("nopuzzle").classList.remove("hide");
